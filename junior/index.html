<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中教育會考模擬試題</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-level="junior" data-base="../">
  <nav class="nav-bar">
    <div class="container">
      <a href="../index.html">← 返回首頁</a>
    </div>
  </nav>

  <header class="exam-header">
    <h1>國中教育會考</h1>
    <p class="subtitle">模擬試題｜隨機抽題 · 互動作答</p>
    <div class="exam-info">
      <span>🎲 每次題目不同</span>
      <span>📚 三難度各 200 題</span>
      <span>✅ 即時回饋</span>
    </div>
  </header>

  <div class="container">
    <section class="bank-stats-panel" id="bank-stats-panel">
      <h3>📚 題庫概覽</h3>
      <p id="bank-status-text">載入中…</p>
      <ul class="bank-stats-list" id="bank-stats-list"></ul>
      <p class="bank-update-info" id="bank-update-info"></p>
    </section>

    <div class="subject-grid" id="subject-grid"></div>

    <div class="exam-notice">
      <h4>📋 使用說明</h4>
      <ul>
        <li>先選科目，再選<strong>簡單／普通／困難</strong>開始測驗</li>
        <li>點選選項作答，立即顯示答對或答錯</li>
        <li>測驗頁面可「重新抽題」更換題目</li>
        <li>每月 1 日自動更新題庫</li>
      </ul>
    </div>
  </div>

  <footer class="footer"><p>國中教育會考模擬試題｜供教學使用</p></footer>

  <script src="../assets/js/auth-config.js"></script>
  <script src="../assets/js/auth-gate.js"></script>
  <script>
    AuthGate.guardPage({ zone: 'junior', homeUrl: '../index.html' }).then(ok => {
      if (!ok) return;
      const s1 = document.createElement('script'); s1.src = '../assets/js/exam-config.js';
      s1.onload = () => {
        const s2 = document.createElement('script'); s2.src = '../assets/js/bank-manager.js';
        s2.onload = () => {
          const s3 = document.createElement('script'); s3.src = '../assets/js/level-index.js';
          document.body.appendChild(s3);
        };
        document.body.appendChild(s2);
      };
      document.body.appendChild(s1);
    });
  </script>
</body>
</html>
