<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模擬試題</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <a href="#" id="btn-back">← 返回</a>
      <div class="nav-links">
        <a href="#" id="btn-regenerate" class="no-print">🔄 重新抽題</a>
        <a href="#" id="btn-answers" class="no-print">查看解答</a>
      </div>
    </div>
  </nav>

  <header class="exam-header" id="exam-header">
    <h1 id="exam-title">模擬試題</h1>
    <p class="subtitle" id="subject-name"></p>
    <div class="exam-info">
      <span id="exam-meta"></span>
      <span id="exam-id" class="exam-session-badge"></span>
    </div>
  </header>

  <div class="container">
    <div class="exam-notice no-print">
      <h4>📝 互動作答模式</h4>
      <ul>
        <li>點選選項作答，<strong>立即顯示答對或答錯</strong></li>
        <li>非選擇題請在紙上作答，完成後點「查看解答」</li>
      </ul>
    </div>
    <div id="exam-content"></div>
  </div>

  <footer class="footer"><p id="footer-text"></p></footer>

  <script src="assets/js/exam-config.js"></script>
  <script src="assets/js/bank-manager.js"></script>
  <script src="assets/js/exam-engine.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const level = params.get('level') || 'junior';
    const subject = params.get('subject');
    const levelInfo = ExamConfig.getLevel(level);
    const config = ExamConfig.getSubject(level, subject);

    const backLinks = {
      junior: 'junior/index.html',
      gsat: 'senior/gsat/index.html',
      ast: 'senior/ast/index.html'
    };
    document.getElementById('btn-back').href = backLinks[level] || 'index.html';

    if (!config || !levelInfo) {
      document.body.innerHTML = '<div class="container"><h2>找不到此測驗，請從<a href="index.html">首頁</a>選擇。</h2></div>';
    } else {
      document.getElementById('exam-title').textContent = levelInfo.name + '模擬試題';

      BankManager.initForExam(level, subject).then(() => initExam()).catch(() => {
        document.getElementById('exam-content').innerHTML = '<p>題庫載入失敗。</p>';
      });

      function initExam(regenerate) {
        const forceNew = params.get('new') === '1';
        if (!regenerate && !forceNew && ExamEngine.getExam(level, subject)) {
          render(ExamEngine.getExam(level, subject));
        } else {
          const exam = ExamEngine.generateExam(level, subject);
          if (!exam) {
            document.getElementById('exam-content').innerHTML = '<p>題庫尚未建立。</p>';
            return;
          }
          render(exam);
        }
      }

      function render(exam) {
        document.getElementById('subject-name').textContent = config.name;
        const total = exam.questions.length;
        const choiceN = exam.questions.filter(q => !q.isNonChoice).length;
        const nonChoiceN = total - choiceN;
        const bankSize = BankManager.countUnits(BankManager.getBank(level, subject));
        let meta = nonChoiceN > 0
          ? `選擇題 ${choiceN} 題 + 非選擇題 ${nonChoiceN} 題｜${config.time} 分鐘｜題庫 ${bankSize} 題`
          : `選擇題 ${total} 題｜${config.time} 分鐘｜題庫 ${bankSize} 題`;
        document.getElementById('exam-meta').textContent = meta;
        document.getElementById('exam-id').textContent = `測驗編號：${exam.examId}`;
        document.getElementById('exam-header').style.background = `linear-gradient(135deg, ${config.color}, ${config.color}cc)`;
        document.getElementById('footer-text').textContent = `${levelInfo.shortName}模擬試題｜${config.name}`;
        ExamEngine.renderExam(exam, document.getElementById('exam-content'));
      }

      document.getElementById('btn-regenerate').addEventListener('click', e => {
        e.preventDefault();
        if (confirm('確定要重新抽題嗎？')) initExam(true);
      });

      document.getElementById('btn-answers').href = `answers.html?level=${level}&subject=${subject}`;
    }
  </script>
</body>
</html>
