<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會考模擬試題｜解答</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <a href="index.html">← 返回首頁</a>
      <div class="nav-links">
        <a href="#" id="btn-exam">返回試題</a>
        <a href="#" id="btn-new-exam" class="no-print">🔄 重新抽題測驗</a>
      </div>
    </div>
  </nav>

  <header class="exam-header" id="exam-header" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">
    <h1>國中教育會考模擬試題</h1>
    <p class="subtitle" id="subject-name"></p>
    <p class="subtitle">解答與解析</p>
  </header>

  <div class="container answer-key">
    <div id="answer-content"></div>
  </div>

  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

  <script src="assets/js/exam-engine.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const subject = params.get('subject');
    const config = ExamEngine.SUBJECTS[subject];

    if (!config) {
      document.getElementById('answer-content').innerHTML = '<p>找不到此科目。</p>';
    } else {
      document.getElementById('subject-name').textContent = config.name;
      document.getElementById('footer-text').textContent = `國中教育會考模擬試題｜${config.name}解答`;
      document.getElementById('btn-exam').href = `exam.html?subject=${subject}`;
      document.getElementById('btn-new-exam').href = `exam.html?subject=${subject}&new=1`;

      const exam = ExamEngine.getExam(subject);
      if (!exam) {
        document.getElementById('answer-content').innerHTML = `
          <div class="exam-notice">
            <h4>尚無測驗紀錄</h4>
            <p>請先<a href="exam.html?subject=${subject}">開始測驗</a>，完成後再查看解答。</p>
          </div>`;
      } else {
        ExamEngine.renderAnswers(exam, document.getElementById('answer-content'));
      }
    }
  </script>
</body>
</html>
